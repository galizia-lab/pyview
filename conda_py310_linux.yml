name: view_py310
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pyqt=5
  - qtpy
  - pip
  - scipy
  - scikit-image
  - jinja2
  - seaborn
  - bokeh
  - xlrd
  - pyqtgraph
  - whoosh
  - openpyxl
  - jupyter
  - appdirs
# only available on conda-forge
  - moviepy
  - libstdcxx-ng
  - # ensure consistent BLAS/LAPACK stack
  - blas=*=openblas
