name: view_dev_py310
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pyqt=5
  - pip
  - scipy
  - scikit-image
  - jinja2
  - seaborn
  - bokeh
  - xlrd
  - pyqtgraph
  - whoosh
  - openpyxl
  - pytest
  - pandas-stubs
  - ipython
  - jupyter
  - appdirs
# only available on conda-forge
  - moviepy
  - ipdb
  - libstdcxx-ng
    # ensure consistent BLAS/LAPACK stack
  - blas=*=openblas