name: view_py313
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13
  - pyqt6
  - qtpy
  - pip
  - scipy
  - scikit-image
  - numpy>=2
  - pandas>=3
  - jinja2
  - seaborn
  - bokeh
  - xlrd
  - pyqtgraph
  - whoosh
  - openpyxl
  - jupyter
  - appdirs
  # only available on conda-forge
  - moviepy>=1.0.0,<2
  - libstdcxx-ng
  # ensure consistent BLAS/LAPACK stack
  - blas=*=openblas

